<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Pastelería Zaret</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #faf8f3 0%, #f5f1e8 100%);
            color: #3d2817;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.5s ease-out;
        }
        .auth-card h1 {
            text-align: center;
            font-size: 1.8em;
            color: #3d2817;
            margin-bottom: 8px;
        }
        .auth-card p.subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9em;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8d4c0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #d4a373;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #d4a373;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-primary:hover { background: #c99963; }
        .auth-links {
            text-align: center;
            margin-top: 20px;
        }
        .auth-links a {
            color: #d4a373;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-links a:hover { text-decoration: underline; }
        .messages { margin-bottom: 20px; }
        .messages .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .messages .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #999;
            text-decoration: none;
        }
        .back-link:hover { color: #3d2817; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>Pastelería Zaret</h1>
        <p class="subtitle">Inicia sesión para acceder al panel</p>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="{% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Correo o Usuario</label>
                <input type="text" name="email" required placeholder="correo o usuario">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <div class="auth-links">
            ¿No tienes cuenta? <a href="{% url 'register' %}">Regístrate aquí</a>
        </div>
        <a href="{% url 'gallery' %}" class="back-link">← Volver a la tienda</a>
    </div>
</body>
</html>
